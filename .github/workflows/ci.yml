name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # The whole-repository check. A reviewer should be able to see, from one green
  # job, that the module type-checks, builds, and passes every test.
  check-build-test:
    name: check + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: moon version --all

      - name: Update the registry index
        # A fresh runner has no registry index, so resolving `moonbitlang/x`
        # fails with "module was not found in the registry" without this.
        run: moon update

      - name: Formatting
        # Checked, never applied: CI must not rewrite the tree it is judging,
        # and `moon fmt` needs git on PATH to render its diff.
        run: moon fmt --check

      - name: Type check
        # Deny warnings here so a new deprecated-API usage fails the build
        # rather than accumulating. The codebase is currently warning-free.
        run: moon check --deny-warn

      - name: Build every target
        # wasm, wasm-gc, js and native. The library is pure MoonBit with no
        # FFI, so all four must build; a failure here means a portability
        # regression.
        run: moon build --target all

      - name: Tests
        # 64 tests. Includes the differential conformance suite, which reads
        # testdata/differential.tsv and compares csvkit against the expected
        # output of an independent implementation (see NOTICE).
        run: moon test --target all

      - name: Report test counts
        run: moon test --target wasm --verbose 2>&1 | tail -5

  # The library must be usable from a real program, not just from its own
  # tests. This job exercises the CLI on the checked-in example file.
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update the registry index
        run: moon update

      - name: version
        run: moon run cmd/main -- version

      - name: count
        run: moon run cmd/main -- count examples/people.csv

      - name: re-serialize
        run: moon run cmd/main -- csv examples/people.csv

      - name: check reports issues on a ragged file
        # `check` exits 1 when it finds an issue, so invert the expectation
        # explicitly instead of letting the step simply fail.
        run: |
          if moon run cmd/main -- check examples/people.csv; then
            echo "::error::expected `check` to report a ragged row and exit 1"
            exit 1
          else
            echo "check exited non-zero as expected"
          fi

  # The differential corpus is checked in because the test reads it, but it must
  # be reproducible from its generator. If this job fails, either the generator
  # was not re-run after a change or the .tsv was edited by hand.
  #
  # The same job guards the figures quoted in prose: `report_size.py --check`
  # derives the line counts and the test-case count from the repository and
  # fails if a document disagrees. Three documents once quoted three different
  # values for the same measurement, which is what this step exists to prevent.
  generated-files-are-current:
    name: generated files and quoted figures are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Regenerate the differential corpus
        # Pure standard library, no pip install needed.
        run: python3 tools/gen_differential.py

      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --quiet; then
            echo "::error::testdata/differential.tsv is out of date; re-run tools/gen_differential.py and commit the result"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Quoted figures agree with the repository
        run: python3 tools/report_size.py --check

  # The conformance layer is a shipped capability, so it is exercised rather
  # than merely compiled. Two independent things are asserted:
  #
  #   1. csvkit itself conforms. This is the library's own claim and it must
  #      hold on every push.
  #   2. The published ecosystem report still matches what the tool produces.
  #      A third-party result changing is not a failure of this project, but an
  #      un-regenerated report would be a document that no longer says what the
  #      tool says, which is worse than not publishing one.
  conformance:
    name: conformance layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update the registry index
        run: moon update

      - name: Build the conformance package
        # A package of this module can only build for the intersection of its
        # dependencies' supported targets. That is why `sikadi123/moonbit-csv`,
        # which declares js and wasm-gc only, is not among the candidates: it
        # would cost the module the `wasm` target that the library supports.
        run: moon build conformance

      - name: csvkit conforms to the corpus
        run: |
          moon run conformance -- csvkit | tee /tmp/csvkit.txt
          if ! grep -q "1078/1078 conform" /tmp/csvkit.txt; then
            echo "::error::csvkit no longer agrees with the reference on every corpus document"
            exit 1
          fi

      - name: The published report is current
        run: |
          python3 tools/conformance_report.py
          if ! git diff --quiet docs/ecosystem-conformance.md; then
            echo "::error::docs/ecosystem-conformance.md is stale; re-run tools/conformance_report.py and commit the result"
            git --no-pager diff --stat docs/ecosystem-conformance.md
            exit 1
          fi

  # Packaging proves the module metadata is coherent: name, version, license,
  # readme and repository all have to resolve for `moon package` to succeed.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update the registry index
        run: moon update

      - name: Package the module
        run: moon package

      - name: Show the produced archive
        run: ls -l _build/publish/
